<title>우리 둘만의 통화</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #17212c;
    --line: #26323f;
    --text: #eef2f6;
    --muted: #8b9aab;
    --accent: #3ddc97;
    --mine: #1f6b4c;
    --danger: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Noto Sans JP", "Noto Sans TC", sans-serif;
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow: hidden;
  }
  main { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* ---------- 시작 화면 ---------- */
  #setup { overflow-y: auto; padding-bottom: 20px; }
  #setup[hidden], #call[hidden] { display: none; }
  header { padding: 32px 0 18px; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 8px; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none;
    -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 10px 0 0; }
  .primary {
    width: 100%; margin-top: 20px; padding: 16px; font-size: 17px; font-weight: 600;
    background: var(--accent); color: #062014;
  }
  .primary:active { transform: scale(0.98); }
  #err { color: var(--danger); font-size: 14px; line-height: 1.5; margin: 12px 0 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0; line-height: 1.5; }

  /* ---------- 통화 화면 ---------- */
  #call { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 14px 4px 12px;
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.waiting { animation: blink 1.4s infinite; }
  .dot.live { background: var(--accent); }
  @keyframes blink { 50% { opacity: 0.25; } }
  .topinfo { flex: 1; min-width: 0; }
  #status { font-size: 16px; font-weight: 600; }
  #detail { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 2px; }
  #detail:empty { display: none; }
  .topright { text-align: right; flex: none; }
  #timer { font-size: 16px; font-variant-numeric: tabular-nums; }
  #net { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

  #chat {
    flex: 1; min-height: 0; overflow-y: auto; padding: 16px 2px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .empty { margin: auto; color: var(--muted); font-size: 14px; text-align: center; line-height: 1.6; padding: 0 20px; }
  .row { display: flex; flex-direction: column; max-width: 84%; }
  .row.theirs { align-self: flex-start; align-items: flex-start; }
  .row.mine { align-self: flex-end; align-items: flex-end; }
  .bubble {
    border-radius: 16px; padding: 10px 14px; line-height: 1.5; word-break: break-word;
    background: var(--card); border: 1px solid var(--line);
  }
  .mine .bubble { background: var(--mine); border-color: var(--mine); }
  .theirs .bubble { border-top-left-radius: 6px; }
  .mine .bubble { border-top-right-radius: 6px; }
  .orig { font-size: 16px; }
  .tr {
    font-size: 15px; color: #c9d4df; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.14);
  }
  .mine .tr { color: #d6f5e7; }
  .tr:empty { display: none; }
  .interim .bubble { opacity: 0.75; }
  .interim .orig::after { content: " …"; color: var(--muted); }
  .time { font-size: 11px; color: var(--muted); margin: 4px 4px 0; }
  .notice {
    align-self: center; font-size: 12.5px; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; text-align: center; max-width: 92%;
  }

  #unlock { margin: 0 auto 8px; padding: 10px 16px; background: #f5c542; color: #2a2000; font-weight: 600; font-size: 14px; }
  #unlock[hidden] { display: none; }

  .controls {
    display: flex; gap: 22px; justify-content: center; align-items: flex-start;
    padding: 12px 0 18px; border-top: 1px solid var(--line);
  }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); width: 72px; }
  .round {
    width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--text);
  }
  .round svg { width: 26px; height: 26px; }
  .round.on { background: var(--text); color: var(--bg); }
  .round.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .round.cc { font-weight: 700; font-size: 15px; }
  .round.cc.active { background: var(--accent); border-color: var(--accent); color: #062014; }
</style>

<main>
  <!-- ============ 시작 화면 ============ -->
  <section id="setup">
    <div class="card" style="margin-top:36px">
      <label for="lang" id="t_langLabel">내가 말하는 언어</label>
      <select id="lang">
        <option value="ko-KR">한국어</option>
        <option value="ja-JP">日本語</option>
        <option value="zh-TW">中文（繁體）</option>
        <option value="en-US">English</option>
      </select>

      <label for="code" id="t_codeLabel">둘이 정한 암호</label>
      <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="hint" id="t_codeHint"></p>

      <div id="adminFields" style="display:none">
        <label for="stt" id="t_sttLabel">받아쓰기 방식</label>
        <select id="stt">
          <option value="fast" id="t_sttFast"></option>
          <option value="ai" id="t_sttAi"></option>
        </select>

        <label for="gkey" id="t_keyLabel"></label>
        <input id="gkey" type="password" placeholder="AQ.… / AIza…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p class="hint" id="t_keyHint"></p>
      </div>

      <button id="join" class="primary">통화 시작</button>
      <p id="err"></p>
    </div>
    <footer><b id="verTap" style="color:var(--text);cursor:pointer">v13</b><br>
      <span id="installHint" style="display:none"></span>
      <span id="t_privacy"></span></footer>
  </section>

  <!-- ============ 통화 화면 ============ -->
  <section id="call" hidden>
    <div class="topbar">
      <div id="dot" class="dot waiting"></div>
      <div class="topinfo">
        <div id="status"></div>
        <div id="detail"></div>
      </div>
      <div class="topright">
        <div id="timer">00:00</div>
        <div id="net"></div>
      </div>
    </div>

    <div id="chat">
      <div id="empty" class="empty"></div>

function detectLang() {
  const cands = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "ko"]);
  for (const c of cands) {
    const l = (c || "").toLowerCase();
    if (l.startsWith("ko")) return "ko-KR";
    if (l.startsWith("ja")) return "ja-JP";
    if (l.startsWith("zh")) return "zh-TW";
    if (l.startsWith("en")) return "en-US";
  }
  return "ko-KR";
}

async function hashCode(text) {
  const data = new TextEncoder().encode("duocall:" + text.trim());
  const buf = await crypto.subtle.digest("SHA-256", data);
  return "duocall-" + [...new Uint8Array(buf)].slice(0, 12).map((b) => b.toString(16).padStart(2, "0")).join("");
}

  if (!navigator.mediaDevices || !window.isSecureContext) { showError("이 페이지는 https:// 주소에서만 마이크를 쓸 수 있어요."); return; }
  gKey = els.gkey.value.trim();
  aiMode = els.stt.value === "ai";
  try {
    localStorage.setItem("duocall-code", code);
    localStorage.setItem("duocall-lang", myLang);
    localStorage.setItem("duocall-gkey", gKey);
    localStorage.setItem("duocall-stt", els.stt.value);
  } catch (e) {}

  els.join.disabled = true;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false,
    });
  } catch (e) {
    els.join.disabled = false;
    showError(t("micDenied"));
    return;
  }
  els.join.disabled = false;

  ensureAudioCtx();
  els.remote.muted = false;
  els.remote.play().catch(() => {});

  base = await hashCode(code);
  clearChat();
  active = true;
  els.setup.hidden = true;
  els.call.hidden = false;
  setLive(false);
  setStatus(t("connecting"));
  requestWakeLock();
  startPeer("a");
});

    if (peer !== p) return;
    if (role === "a") {
      setStatus(t("waiting"), t("waitingSub"));
    } else {
      setStatus(t("connectingPeer"));
      dial();
      startRedial();
    }
  });

  p.on("call", (call) => {
    if (peer !== p) return;
    if (activeCall && activeCall !== call) { const old = activeCall; activeCall = null; old.close(); }
    if (pendingCall && pendingCall !== call) pendingCall.close();
    call.answer(localStream);
    watchCall(call);
  });

  p.on("connection", (conn) => {
    if (peer !== p) return;
    setupData(conn);
  });

  p.on("disconnected", () => {
    if (peer !== p || p.destroyed) return;
    setTimeout(() => { if (peer === p && !p.destroyed && p.disconnected) p.reconnect(); }, 1500);
  });

  p.on("error", (err) => {
    if (peer !== p) return;
    const t = err && err.type;
    if (t === "unavailable-id") {
      if (role === "a") { p.destroy(); startPeer("b"); }
      else {
        p.destroy();
        setStatus("잠시 후 다시 연결할게요…", "방금 접속했던 기록이 아직 남아 있어요. 몇 초 뒤 자동으로 다시 시도해요.");
        setTimeout(() => { if (active && peer === p) startPeer("a"); }, 6000);
      }
      return;
    }
    if (t === "peer-unavailable") {
      pendingCall = null;
      if (!activeCall) setStatus(t("waiting"), t("waitingSub"));
      return;
    }
    if (t === "network" || t === "server-error" || t === "socket-error" || t === "socket-closed") {
      if (!activeCall) setStatus("연결 서버에 다시 접속 중…", "인터넷 연결을 확인해 주세요.");
      setTimeout(() => { if (peer === p && !p.destroyed && p.disconnected) p.reconnect(); }, 3000);
      return;
    }
    if (t === "browser-incompatible") {
      setStatus("이 브라우저는 통화를 지원하지 않아요", "아이폰은 Safari, 안드로이드는 Chrome으로 열어 주세요.");
      return;
    }
    console.warn("peer error", err);
  });
}

function otherId() { return `${base}-${role === "a" ? "b" : "a"}`; }

function dial() {
  if (!active || !peer || peer.destroyed || !peer.open || activeCall || pendingCall) return;
  const call = peer.call(otherId(), localStream);
  if (call) watchCall(call);
}
function startRedial() {
  clearInterval(redialTimer);
  redialTimer = setInterval(() => { if (role === "b" && !activeCall) dial(); }, 4000);
}

function watchCall(call) {
  pendingCall = call;
  clearTimeout(slowTimer);
  slowTimer = setTimeout(() => {
    if (pendingCall === call && !activeCall) {
      setStatus("연결이 오래 걸리고 있어요…", "인터넷 연결을 확인하고 잠시 기다려 주세요.");
    }
  }, 15000);

  let live = false, everLive = false;

  const goLive = () => {
    if (live || activeCall !== call) return;
    live = true; everLive = true;
    clearTimeout(slowTimer);
    if (chatFromEndedCall) clearChat();
    els.remote.play().then(() => { els.unlock.hidden = true; }).catch(() => { els.unlock.hidden = false; });
    setLive(true);
    setStatus(t("talking"), "");
    if (!clockTimer) startClock();
    lowLatency(call.peerConnection);
    startStats(call);
    // 자막용 데이터 연결은 전화를 건 쪽(b)이 엶
    if (role === "b" && (!dataConn || !dataConn.open)) {
      setupData(peer.connect(otherId(), { reliable: true }));
    }
    updateCaptures();
    // 자막 연결 확인: 상대 정보가 안 오면 다시 시도
    const ensureData = (attempt) => {
      if (activeCall !== call || partnerLang) return;
      if (dataConn && dataConn.open) sendData({ t: "hello", lang: myLang, tr: hasTranslator(), ai: myAi() });
      else if (peer && !peer.destroyed && (role === "b" || attempt >= 2)) setupData(peer.connect(otherId(), { reliable: true }));
      if (attempt < 6) setTimeout(() => ensureData(attempt + 1), 3000);
      else if (!partnerLang) addNotice("⚠ 자막 연결이 안 돼요. 끊고 다시 걸어 주세요.");
    };
    setTimeout(() => ensureData(1), 3000);
  };

  call.on("stream", (stream) => {
    if (pendingCall === call) pendingCall = null;
    activeCall = call;
    els.remote.srcObject = stream;
    remoteStream = stream;
    setStatus(t("found"));
    const s = call.peerConnection && call.peerConnection.iceConnectionState;
    if (s === "connected" || s === "completed") goLive();
  });

  call.on("close", () => endCall(call, t("ended")));
  call.on("error", () => endCall(call, t("ended")));

  const pc = call.peerConnection;
  if (pc) {
    pc.addEventListener("iceconnectionstatechange", () => {
      const s = pc.iceConnectionState;
      if (s === "connected" || s === "completed") {
        if (live) setStatus(t("talking"), ""); else goLive();
      } else if (s === "disconnected" && live && activeCall === call) {
        setStatus(t("unstable"), t("unstableSub"));
      } else if (s === "failed") {
        if (!activeCall) activeCall = call;
        endCall(call, everLive ? "통화 연결이 끊겼어요" : "소리 연결에 실패했어요");
        if (!everLive) els.detail.textContent = "잠시 후 자동으로 다시 시도해요.";
        call.close();
      }
    });
  }
}

function endCall(call, message) {
  if (pendingCall === call) pendingCall = null;
  if (activeCall !== call) return;
  activeCall = null;
  if (lines.size) chatFromEndedCall = true;
  stopAllCaptures();
  stopStats();
  stopClock();
  els.remote.srcObject = null;
  els.unlock.hidden = true;
  setLive(false);
  if (!active) return;
  setStatus(message, t("endedSub"));
}

/* =====================================================================
   자막 데이터 주고받기
   ===================================================================== */
function setupData(conn) {
  if (!conn) return;
  if (dataConn && dataConn !== conn) { try { dataConn.close(); } catch (e) {} }
  dataConn = conn;
  conn.on("open", () => { if (dataConn === conn) sendData({ t: "hello", lang: myLang, tr: hasTranslator(), ai: myAi() }); });
  conn.on("data", (msg) => { if (dataConn === conn) onData(msg); });
  conn.on("close", () => { if (dataConn === conn) dataConn = null; });
  conn.on("error", () => {});
}
function sendData(msg) {
  if (dataConn && dataConn.open) { try { dataConn.send(msg); } catch (e) {} }
}

function onData(msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.t === "hello") {
    const first = partnerLang === null;
    if (TR_CODE[msg.lang]) partnerLang = msg.lang;
    partnerCanTr = !!msg.tr;
    partnerAi = !!msg.ai;
    updateCaptures();
    if (first) {
      sendData({ t: "hello", lang: myLang, tr: hasTranslator(), ai: myAi() });
      addNotice(t("partnerLang") + (LANG_NAME[partnerLang] || "?"));
      if (!hasTranslator() && !partnerCanTr) addNotice(t("noKey"));
    }
    return;
  }
  if (msg.t === "self" && typeof msg.id === "string") {
    // 상대 기기가 받아 적어 준 "내" 말
    renderLine({
      id: "m-" + msg.id, mine: true,
      text: String(msg.text || "").slice(0, 2000),
      tr: typeof msg.tr === "string" ? msg.tr.slice(0, 2000) : null,
      final: !!msg.final,
    });
    return;
  }
  if (msg.t === "drop" && typeof msg.id === "string") {
    removeLine((msg.kind === "self" ? "m-" : "p-") + msg.id);
    return;
  }
  if (msg.t === "tr" && typeof msg.id === "string" && typeof msg.tr === "string") {
    setTr("m-" + msg.id, msg.tr.slice(0, 2000), !!msg.final);
    return;
  }
  if (msg.t === "line" && typeof msg.id === "string") {
    const text = String(msg.text || "").slice(0, 2000);
    const hasTr = typeof msg.tr === "string";
    renderLine({ id: "p-" + msg.id, mine: false, text, tr: hasTr ? msg.tr.slice(0, 2000) : null, final: !!msg.final });

    // 상대에게 번역 키가 없으면 내가 대신 번역해서 양쪽에 보여줌
    const helping = !partnerCanTr && hasTranslator() && partnerLang && !hasTr;
    if (msg.final && !seenFinal.has(msg.id)) {
      seenFinal.add(msg.id);
      if (helping) {
        const id = msg.id;
        const job = translate(text, partnerLang, myLang, "partner");
        job.then((tr) => { if (tr) { setTr("p-" + id, tr, true); sendData({ t: "tr", id, tr, final: true }); } });
      }
      remember("partner", text.slice(0, 300));
    } else if (!msg.final && helping) {
      const now = Date.now();
      const gap = geminiKey() ? 2500 : 1000;
      if (!pInterimBusy && now - lastPInterim > gap && text.length >= 4) {
        lastPInterim = now; pInterimBusy = true;
        const id = msg.id;
        translate(text, partnerLang, myLang, "partner").then((tr) => {
          pInterimBusy = false;
          if (tr && !seenFinal.has(id)) { setTr("p-" + id, tr, false); sendData({ t: "tr", id, tr, final: false }); }
        });
      }
    }
  }
}

/* =====================================================================
   말풍선 그리기
   ===================================================================== */
const lines = new Map();   // id → { row, orig, tr, time }

function nearBottom() { return els.chat.scrollHeight - els.chat.scrollTop - els.chat.clientHeight < 80; }
function scrollDown() { els.chat.scrollTop = els.chat.scrollHeight; }

function renderLine({ id, mine, text, tr, final }) {
  if (els.empty) { els.empty.remove(); els.empty = null; }
  const stick = nearBottom();
  let L = lines.get(id);
  if (!L) {
    const row = document.createElement("div");
    row.className = "row " + (mine ? "mine" : "theirs");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const orig = document.createElement("div"); orig.className = "orig";
    const trEl = document.createElement("div"); trEl.className = "tr";
    bubble.append(orig, trEl);
    const time = document.createElement("div"); time.className = "time";
    row.append(bubble, time);
    els.chat.append(row);
    L = { row, orig, tr: trEl, time, final: false };
    lines.set(id, L);
  }
  if (L.final && !final) return;          // 이미 확정된 문장은 덮어쓰지 않음
  L.orig.textContent = text;
  if (tr !== null && tr !== undefined) L.tr.textContent = tr;
  L.row.classList.toggle("interim", !final);
  if (final) {
    L.final = true;
    const d = new Date();
    L.time.textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  if (stick || mine) scrollDown();
}

function removeLine(id) {
  const L = lines.get(id);
  if (L) { L.row.remove(); lines.delete(id); }
}

let pInterimBusy = false, lastPInterim = 0;
function setTr(id, tr, final) {
  const L = lines.get(id);
  if (!L) return;
  if (L.trFinal && !final) return;
  if (final) L.trFinal = true;
  const stick = nearBottom();
  L.tr.textContent = tr;
  if (stick) scrollDown();
}

let chatFromEndedCall = false;   // 지난 통화 기록이 화면에 남아 있는지
function clearChat() {
  els.chat.textContent = "";
  const e = document.createElement("div");
  e.id = "empty"; e.className = "empty";
  e.innerHTML = "연결되면 서로 말하는 내용이<br>여기에 원문과 번역으로 나타나요.";
  els.chat.append(e);
  els.empty = e;
  lines.clear();
  history.length = 0;
  seenFinal.clear();
  chatFromEndedCall = false;
}

function addNotice(text) {
  if (els.empty) { els.empty.remove(); els.empty = null; }
  const n = document.createElement("div");
  n.className = "notice";
  n.textContent = text;
  els.chat.append(n);
  scrollDown();
}

/* =====================================================================
   번역
   ===================================================================== */
let keyWarned = false, geminiWarned = false;

/* 최근 대화 기억 (AI가 문맥을 보고 더 자연스럽게 번역하도록) */
const history = [];
const seenFinal = new Set();
function remember(who, text) {
  if (!text) return;
  history.push({ who, text });
  if (history.length > 8) history.shift();
}

async function translate(text, fromLang, toLang, speaker = "me") {
  if (!text || !toLang || fromLang === toLang) return null;
  if (!geminiKey() && !TRANSLATE_KEY) {
    if (!keyWarned) { keyWarned = true; addNotice("번역 키가 아직 없어서 원문만 보여요."); }
    return null;
  }
  if (geminiKey()) {
    const r = await translateGemini(text, fromLang, toLang, speaker);
    if (r) return r;
  }
  if (TRANSLATE_KEY) return translateGoogle(text, fromLang, toLang);
  return null;
}

const GEMINI_MODELS = [GEMINI_MODEL, "gemini-flash-latest", "gemini-2.5-flash-lite", "gemini-2.5-flash"]
  .filter((m, i, arr) => arr.indexOf(m) === i);
let modelIdx = 0;
let lastTrError = "";

let errTimer = null;
function noteTrError(msg, important) {
  lastTrError = msg || "";
  // 사용량 한도 등 중요한 것만 사용자에게 잠깐 알림. 나머지는 조용히 무시.
  if (msg && important) showTransient(msg);
}
function showTransient(msg) {
  const el = els.detail;
  if (!el) return;
  el.textContent = "⚠ " + msg;
  clearTimeout(errTimer);
  errTimer = setTimeout(() => { if (el.textContent.startsWith("⚠")) el.textContent = ""; }, 5000);
}

/* Gemini 호출 공통: 모델 이름이 없으면 다음 모델, 한도 초과면 한 번 재시도 */
async function geminiCall(bodyObj) {
  const body = JSON.stringify(bodyObj);
  let retried = false;
  for (let tries = 0; tries < GEMINI_MODELS.length + 1; tries++) {
    const model = GEMINI_MODELS[modelIdx];
    let res;
    try {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": geminiKey() },
        body,
      });
    } catch (e) {
      noteTrError("AI 서버에 연결하지 못했어요 (네트워크 또는 키 문제)");
      return null;
    }
    if (res.ok) {
      const data = await res.json().catch(() => null);
      const parts = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
      const out = parts ? parts.filter((p) => !p.thought).map((p) => p.text || "").join("").trim() : "";
      lastTrError = "";
      return out;
    }
    let detail = "";
    try { const j = await res.json(); detail = (j && j.error && j.error.message) || ""; } catch (e) {}
    if (res.status === 404 && modelIdx < GEMINI_MODELS.length - 1) { modelIdx++; continue; }
    if (res.status === 429 && !retried) { retried = true; await new Promise((r) => setTimeout(r, 1500)); continue; }
    if (res.status === 429) noteTrError(t("limit"), true);
    else noteTrError(`AI 오류 ${res.status}: ${detail.slice(0, 140)}`);
    return null;
  }
  return null;
}

function contextText(speaker) {
  return history.slice(-6).map((h) => `${h.who === speaker ? "A" : "B"}: ${h.text}`).join("\n");
}

async function translateGemini(text, fromLang, toLang, speaker) {
  const from = LANG_NAME_EN[fromLang], to = LANG_NAME_EN[toLang];
  const ctx = contextText(speaker);
  const system =
    `You are a live interpreter for a casual phone call between two friends (A speaks ${from}, B speaks ${to}). ` +
    `Translate A's latest utterance from ${from} into natural, spoken ${to}, the way a native speaker would actually say it to a friend. ` +
    `Keep the speaker's tone, politeness level, emotion and slang. The text comes from speech recognition, so silently fix obvious recognition mistakes and missing punctuation. ` +
    `Use the recent conversation only for context. Output ONLY the translation, with no quotes, notes or romanization.`;
  const user = (ctx ? `Recent conversation:\n${ctx}\n\n` : "") + `Translate this (A, ${from}):\n${text}`;
  const out = await geminiCall({
    systemInstruction: { parts: [{ text: system }] },
    contents: [{ role: "user", parts: [{ text: user }] }],
    generationConfig: { temperature: 0.2, maxOutputTokens: 400 },
  });
  return out || null;
}

/* 음성 → 받아쓰기 + 번역을 한 번에 */
async function transcribeGemini(wavB64, fromLang, toLang, speaker) {
  const from = LANG_NAME_EN[fromLang], to = LANG_NAME_EN[toLang];
  const ctx = contextText(speaker);
  const system =
    `You are a live interpreter for a casual phone call between two friends. A speaks ${from}; B speaks ${to}. ` +
    `The audio is one short utterance by A. First transcribe exactly what A said, in ${from}, using its normal script and natural punctuation. ` +
    `Use the recent conversation to resolve unclear words, but never invent words that were not spoken. ` +
    `Then translate it into natural, spoken ${to}, the way a native speaker would say it to a friend, keeping tone, politeness level, emotion and slang. ` +
    `If the audio contains no clear speech (silence, noise, breathing, background sounds, or only filler sounds), return empty strings for both fields.`;
  const parts = [];
  if (ctx) parts.push({ text: `Recent conversation (for context only):\n${ctx}` });
  parts.push({ text: `Utterance by A (${from}):` });
  parts.push({ inlineData: { mimeType: "audio/wav", data: wavB64 } });
  const out = await geminiCall({
    systemInstruction: { parts: [{ text: system }] },
    contents: [{ role: "user", parts }],
    generationConfig: {
      temperature: 0.1,
      maxOutputTokens: 600,
      responseMimeType: "application/json",
      responseSchema: {
        type: "OBJECT",
        properties: { text: { type: "STRING" }, translation: { type: "STRING" } },
        required: ["text", "translation"],
      },
    },
  });
  if (out === null) return null;
  try {
    const j = JSON.parse(out.replace(/^```(?:json)?\s*|\s*```$/g, ""));
    return { text: String(j.text || "").trim(), tr: String(j.translation || "").trim() };
  } catch (e) {
    return { text: out.trim(), tr: "" };
  }
}

async function translateGoogle(text, fromLang, toLang) {
  try {
    const res = await fetch(`https://translation.googleapis.com/language/translate/v2?key=${encodeURIComponent(TRANSLATE_KEY)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q: text, source: TR_CODE[fromLang], target: TR_CODE[toLang], format: "text" }),
    });
    if (!res.ok) {
      if (!keyWarned) { keyWarned = true; addNotice(`번역 오류 (${res.status}) — 번역 키 설정을 확인해 주세요.`); }
      return null;
    }
    const data = await res.json();
    return data && data.data && data.data.translations && data.data.translations[0]
      ? data.data.translations[0].translatedText : null;
  } catch (e) {
    return null;
  }
}

/* =====================================================================
   내 말 받아쓰기 (음성인식)
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recRunning = false, ccWanted = true;
let lineSeq = 0, curId = null, curText = "", curTr = null;
let lastInterimTr = 0, interimTrBusy = false, restartTimer = null, recFailCount = 0;
const myTag = Math.random().toString(36).slice(2, 7);

function updateCcUi() {
  const on = ccWanted && (recRunning || capMine || capTheirs || (partnerAi && !hasTranslator()));
  els.cc.classList.toggle("active", !!on);
  els.ccLabel.textContent = !ccWanted ? t("ccOff") : on ? (myAi() ? t("ccAi") : t("ccOn")) : t("ccReady");
}

function startRecognition() {
  if (!SR) { addNotice("이 브라우저는 받아쓰기를 지원하지 않아요. 아이폰은 Safari, 안드로이드는 Chrome을 써 주세요."); ccWanted = false; updateCcUi(); return; }
  if (!wantBrowserSR() || recRunning) return;
  try {
    rec = new SR();
    rec.lang = myLang;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = () => { recRunning = true; recFailCount = 0; updateCcUi(); };

    rec.onresult = (ev) => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        const t = r[0].transcript;
        if (r.isFinal) finalizeLine(t);
        else interim += t;
      }
      if (interim.trim()) updateInterim(interim.trim());
    };

    rec.onerror = (ev) => {
      const e = ev.error;
      if (e === "not-allowed" || e === "service-not-allowed") {
        ccWanted = false;
        addNotice("받아쓰기 권한이 없어요. [자막] 버튼을 눌러 다시 켜 보세요.");
      } else if (e === "audio-capture") {
        recFailCount++;
        if (recFailCount >= 3) { ccWanted = false; addNotice("이 기기에서는 통화 중 받아쓰기가 안 되는 것 같아요."); }
      }
      // no-speech, aborted, network 등은 onend에서 다시 시작
    };

    rec.onend = () => {
      recRunning = false;
      if (curText) finalizeLine(curText);   // 끊기며 남은 문장 확정
      updateCcUi();
      clearTimeout(restartTimer);
      if (wantBrowserSR()) restartTimer = setTimeout(startRecognition, 300);
    };

    rec.start();
  } catch (e) {
    recRunning = false;
    updateCcUi();
  }
}

function stopRecognition() {
  clearTimeout(restartTimer);
  if (rec) {
    const r = rec; rec = null;
    r.onend = null; r.onresult = null; r.onerror = null;
    try { r.abort(); } catch (e) {}
  }
  recRunning = false;
  curId = null; curText = ""; curTr = null;
  updateCcUi();
}

function updateInterim(text) {
  if (!curId) { curId = `${myTag}-${++lineSeq}`; curTr = null; }
  curText = text;
  const id = curId;
  renderLine({ id: "m-" + id, mine: true, text, tr: curTr, final: false });
  sendData({ t: "line", id, text, tr: curTr, final: false });

  // 말하는 중에도 번역을 갱신 (AI 번역은 사용량 한도 때문에 간격을 넓게)
  const now = Date.now();
  const gap = geminiKey() ? 2500 : 1000;
  if (hasTranslator() && partnerLang && !interimTrBusy && now - lastInterimTr > gap && text.length >= 4) {
    lastInterimTr = now;
    interimTrBusy = true;
    translate(text, myLang, partnerLang).then((tr) => {
      interimTrBusy = false;
      if (tr && curId === id) {
        curTr = tr;
        renderLine({ id: "m-" + id, mine: true, text: curText, tr, final: false });
        sendData({ t: "line", id, text: curText, tr, final: false });
      }
    });
  }
}

function finalizeLine(text) {
  text = (text || "").trim();
  const id = curId || `${myTag}-${++lineSeq}`;
  const prevTr = curTr;
  curId = null; curText = ""; curTr = null;
  if (!text) return;
  renderLine({ id: "m-" + id, mine: true, text, tr: prevTr, final: true });
  sendData({ t: "line", id, text, tr: prevTr, final: true });
  if (hasTranslator() && !partnerLang) setTr("m-" + id, "⚠ 상대방 정보를 아직 못 받아서 번역하지 못했어요", true);
  const job = hasTranslator() && partnerLang ? translate(text, myLang, partnerLang) : Promise.resolve(null);   // 문맥은 호출 순간 기준
  remember("me", text);
  job.then((tr) => {
    if (!tr) {
      if (hasTranslator() && partnerLang) setTr("m-" + id, "⚠ 번역 실패" + (lastTrError ? ` — ${lastTrError}` : ""), true);
      return;
    }
    renderLine({ id: "m-" + id, mine: true, text, tr, final: true });
    sendData({ t: "line", id, text, tr, final: true });
  });
}


/* =====================================================================
   AI 받아쓰기: 말소리를 감지해 문장 단위로 녹음 → Gemini
   ===================================================================== */
let audioCtx = null;
function ensureAudioCtx() {
  try {
    if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  } catch (e) {}
  return audioCtx;
}

let capMine = null, capTheirs = null;

function wantBrowserSR() {
  if (!ccWanted || muted || !activeCall || !partnerLang) return false;
  if (myAi()) return false;                              // AI가 내 말을 받아 적음
  if (partnerAi && !hasTranslator()) return false;       // 상대 기기가 내 말을 받아 적어 줌
  return true;
}

function updateCaptures() {
  const live = !!activeCall && !!partnerLang;
  const wantMine = live && ccWanted && myAi() && !muted && !!localStream;
  const wantTheirs = live && ccWanted && myAi() && !partnerAi && !partnerCanTr && !!remoteStream;

  if (wantMine && !capMine) capMine = createCapture(localStream, "me");
  if (!wantMine && capMine) { capMine.stop(); capMine = null; }
  if (wantTheirs && !capTheirs) capTheirs = createCapture(remoteStream, "partner");
  if (!wantTheirs && capTheirs) { capTheirs.stop(); capTheirs = null; }

  if (wantBrowserSR()) startRecognition(); else stopRecognition();
  updateCcUi();
}

function stopAllCaptures() {
  if (capMine) { capMine.stop(); capMine = null; }
  if (capTheirs) { capTheirs.stop(); capTheirs = null; }
  stopRecognition();
}

function createCapture(stream, who) {
  const ctx = ensureAudioCtx();
  if (!ctx) { addNotice("이 브라우저는 AI 받아쓰기를 지원하지 않아요."); return null; }
  let src, proc, sink;
  try {
    src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1);
    sink = ctx.createGain(); sink.gain.value = 0;
    src.connect(proc); proc.connect(sink); sink.connect(ctx.destination);
  } catch (e) {
    addNotice("마이크 소리를 읽지 못했어요. 페이지를 새로고침해 주세요.");
    return null;
  }
  const rate = ctx.sampleRate;
  const frameMs = (4096 / rate) * 1000;
  const preMax = Math.ceil(350 / frameMs);
  let floor = 0.004, speaking = false, voiced = 0, silentMs = 0, segMs = 0;
  let pre = [], seg = [], segId = null, stopped = false;

  proc.onaudioprocess = (e) => {
    if (stopped) return;
    const d = e.inputBuffer.getChannelData(0);
    const buf = new Float32Array(d);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const thr = Math.max(0.012, floor * 3.5);
    const loud = rms > thr;

    if (!speaking) {
      if (!loud) floor = floor * 0.95 + rms * 0.05;
      pre.push(buf); if (pre.length > preMax) pre.shift();
      voiced = loud ? voiced + 1 : 0;
      if (voiced >= 2) {
        speaking = true;
        seg = pre; pre = []; silentMs = 0; segMs = seg.length * frameMs;
        segId = segmentStart(who);
      }
    } else {
      seg.push(buf); segMs += frameMs;
      silentMs = loud ? 0 : silentMs + frameMs;
      if (silentMs >= 1200 || segMs >= 20000) {
        speaking = false; voiced = 0;
        const frames = seg, id = segId, speechMs = segMs - silentMs;
        seg = []; segId = null;
        segmentEnd(who, id, frames, rate, speechMs);
      }
    }
  };

  return {
    stop() {
      stopped = true;
      proc.onaudioprocess = null;
      try { src.disconnect(); proc.disconnect(); sink.disconnect(); } catch (e) {}
      if (segId) dropSegment(who, segId);
    },
  };
}

function segmentStart(who) {
  const id = `${myTag}-${++lineSeq}`;
  if (who === "me") {
    renderLine({ id: "m-" + id, mine: true, text: "🎙", tr: null, final: false });
    sendData({ t: "line", id, text: "🎙", tr: null, final: false });
  } else {
    renderLine({ id: "p-" + id, mine: false, text: "🎙", tr: null, final: false });
    sendData({ t: "self", id, text: "🎙", tr: null, final: false });
  }
  return id;
}

function dropSegment(who, id) {
  removeLine((who === "me" ? "m-" : "p-") + id);
  sendData({ t: "drop", id, kind: who === "me" ? "line" : "self" });
}

async function segmentEnd(who, id, frames, rate, speechMs) {
  if (speechMs < 450) { dropSegment(who, id); return; }   // 너무 짧은 소리(기침, 잡음)는 버림
  const fromLang = who === "me" ? myLang : partnerLang;
  const toLang = who === "me" ? partnerLang : myLang;
  const wav = encodeWav16k(frames, rate);
  const r = await transcribeGemini(wav, fromLang, toLang, who === "me" ? "me" : "partner");
  if (!r) {
    // 실패하면 🎙 말풍선을 조용히 지움 (오류 문구를 띄우지 않음)
    dropSegment(who, id);
    return;
  }
  if (!r.text) { dropSegment(who, id); return; }
  remember(who === "me" ? "me" : "partner", r.text.slice(0, 300));
  if (who === "me") {
    renderLine({ id: "m-" + id, mine: true, text: r.text, tr: r.tr || null, final: true });
    sendData({ t: "line", id, text: r.text, tr: r.tr || null, final: true });
  } else {
    seenFinal.add(id);
    renderLine({ id: "p-" + id, mine: false, text: r.text, tr: r.tr || null, final: true });
    sendData({ t: "self", id, text: r.text, tr: r.tr || null, final: true });
  }
}

/* Float32 프레임들 → 16kHz 16bit WAV → base64 */
function encodeWav16k(frames, rate) {
  let total = 0;
  for (const f of frames) total += f.length;
  const ratio = rate / 16000;
  const outLen = Math.floor(total / ratio);
  const pcm = new Int16Array(outLen);
  // 평균 내며 줄이기
  let fi = 0, off = 0, acc = 0, cnt = 0, pos = 0, next = ratio;
  for (const f of frames) {
    for (let i = 0; i < f.length; i++) {
      acc += f[i]; cnt++; pos++;
      if (pos >= next && fi < outLen) {
        const v = Math.max(-1, Math.min(1, acc / cnt));
        pcm[fi++] = v < 0 ? v * 0x8000 : v * 0x7fff;
        acc = 0; cnt = 0; next += ratio;
      }
    }
  }
  const bytes = new Uint8Array(44 + fi * 2);
  const dv = new DataView(bytes.buffer);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) bytes[o + i] = str.charCodeAt(i); };
  w(0, "RIFF"); dv.setUint32(4, 36 + fi * 2, true); w(8, "WAVE");
  w(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  w(36, "data"); dv.setUint32(40, fi * 2, true);
  for (let i = 0; i < fi; i++) dv.setInt16(44 + i * 2, pcm[i], true);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* =====================================================================
   지연 줄이기 + 연결 정보
   ===================================================================== */
function lowLatency(pc) {
  if (!pc) return;
  try {
    pc.getReceivers().forEach((r) => {
      if ("jitterBufferTarget" in r) r.jitterBufferTarget = 0;
      else if ("playoutDelayHint" in r) r.playoutDelayHint = 0;
    });
  } catch (e) {}
}
function stopStats() { clearInterval(statsTimer); statsTimer = null; els.net.textContent = ""; }
function startStats(call) {
  stopStats();
  const pc = call.peerConnection;
  if (!pc) return;
  const read = async () => {
    if (activeCall !== call) { stopStats(); return; }
    try {
      const stats = await pc.getStats();
      let pair = null;
      stats.forEach((s) => { if (s.type === "transport" && s.selectedCandidatePairId) pair = stats.get(s.selectedCandidatePairId); });
      if (!pair) stats.forEach((s) => {
        if (s.type === "candidate-pair" && s.state === "succeeded" && (s.nominated || s.selected)) pair = pair || s;
      });
      if (!pair) return;
      const local = stats.get(pair.localCandidateId) || {};
      const remote = stats.get(pair.remoteCandidateId) || {};
      let path;
      if (local.candidateType === "relay" || remote.candidateType === "relay") {
        const proto = (local.relayProtocol || local.protocol || "").toUpperCase();
        path = proto === "UDP" ? "중계" : `중계(${proto || "TCP"})`;
      } else path = "직접";
      const rtt = pair.currentRoundTripTime;
      els.net.textContent = typeof rtt === "number" ? `${path} · ${Math.round(rtt * 1000)}ms` : path;
    } catch (e) {}
  };
  read();
  statsTimer = setInterval(read, 2000);
}

/* =====================================================================
   시계
   ===================================================================== */
function startClock() {
  stopClock();
  startedAt = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
    els.timer.textContent = h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  };
  tick();
  clockTimer = setInterval(tick, 1000);
}
function stopClock() { clearInterval(clockTimer); clockTimer = null; els.timer.textContent = "00:00"; }

/* =====================================================================
   버튼
   ===================================================================== */
els.mute.addEventListener("click", () => {
  muted = !muted;
  if (localStream) localStream.getAudioTracks().forEach((t) => { t.enabled = !muted; });
  els.mute.classList.toggle("on", muted);
  els.muteLabel.textContent = muted ? t("unmute") : t("mute");
  updateCaptures();
});

els.cc.addEventListener("click", () => {
  ccWanted = !ccWanted;
  recFailCount = 0;
  updateCaptures();
});

els.unlock.addEventListener("click", () => {
  els.remote.play().then(() => { els.unlock.hidden = true; }).catch(() => {});
});

els.hangup.addEventListener("click", hangUp);

function hangUp() {
  active = false;
  clearInterval(redialTimer);
  clearTimeout(slowTimer);
  stopAllCaptures();
  stopStats();
  stopClock();
  if (activeCall) { const c = activeCall; activeCall = null; c.close(); }
  if (pendingCall) { const c = pendingCall; pendingCall = null; c.close(); }
  if (dataConn) { const d = dataConn; dataConn = null; try { d.close(); } catch (e) {} }
  if (peer) { const p = peer; peer = null; p.destroy(); }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  els.remote.srcObject = null;
  muted = false; partnerLang = null; partnerCanTr = false; partnerAi = false; remoteStream = null; keyWarned = false; geminiWarned = false; lastTrError = ""; history.length = 0; seenFinal.clear();
  els.mute.classList.remove("on");
  els.muteLabel.textContent = "음소거";
  els.unlock.hidden = true;
  releaseWakeLock();
  els.call.hidden = true;
  els.setup.hidden = false;
}

window.addEventListener("pagehide", () => { if (peer) peer.destroy(); });

/* =====================================================================
   화면 꺼짐 방지
   ===================================================================== */
async function requestWakeLock() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function releaseWakeLock() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && active) requestWakeLock();
});

// 아이폰 Safari에서, 아직 홈 화면 앱이 아닐 때만 설치 안내 표시
(function(){
  try {
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua);
    var standalone = (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var hint = document.getElementById("installHint");
    if (hint && isIOS && !standalone) hint.style.display = "block";
  } catch(e) {}
})();

updateCcUi();
</script>
